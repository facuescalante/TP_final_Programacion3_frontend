<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../../../style.css">

</head>

<body>
    <h1>Login</h1>

    <form id="form">
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="off" placeholder="********" required>
        </div>

        <button type="submit">Ingresar</button>
    </form>

    
    <p>¿No tienes una cuenta? <a href="../registro/registro.html">Regístrate aquí</a></p>

    <script type="module" src="./login.ts"></script>
</body>

</html>
