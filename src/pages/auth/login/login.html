<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
</head>

<body>
<main class="auth-container">
    <div class="auth-card">
        <h2>Iniciar Sesión</h2>
        <p class="auth-subtitle">Ingresa a tu cuenta de Food Store 🍕</p>

        <form id="form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="off" placeholder="********" required>
            </div>

            <button type="submit" class="btn-primary">Ingresar</button>
        </form>

        <p class="auth-footer-text">
            ¿No tienes una cuenta? <a href="../registro/registro.html">Regístrate aquí</a>
        </p>
    </div>
</main>

<script type="module" src="./login.ts"></script>
</body>

</html>
