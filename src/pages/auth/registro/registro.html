<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
</head>

<body>
<main class="auth-container">
    <div class="auth-card">
        <h2>Crear Cuenta</h2>
        <p class="auth-subtitle">Regístrate para empezar a comprar en Food Store 🍕</p>

        <form id="registroForm">
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="******">
            </div>

            <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <p class="auth-footer-text">
            ¿Ya tienes cuenta? <a href="../login/login.html">Inicia sesión aquí</a>
        </p>
    </div>
</main>

<script type="module" src="./registro.ts"></script>
</body>

</html>
