<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Admin Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
</head>
<body>
<div class="admin-layout">
    <!-- Sidebar Fijo -->
    <aside class="admin-sidebar">
        <div>
            <div class="sidebar-brand">
                🍔 Food Store <span>Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="../home/index.html" class="sidebar-link">📊 Dashboard</a>
                <a href="../categories/index.html" class="sidebar-link">📂 Categorías</a>
                <a href="../products/index.html" class="sidebar-link">🍕 Productos</a>
                <a href="./index.html" class="sidebar-link active">📦 Pedidos</a>
                <a href="../home/panel.html" class="sidebar-link">🛒 Ver Tienda</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <button id="btnLogout" class="btn-primary" style="width: 100%; background: #dc2626;">Cerrar sesión</button>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="admin-main-content">
        <div class="admin-header-title">
            <h1>Pedidos</h1>
        </div>

        <!-- Filtro por Estado -->
        <div style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem;">
            <label for="filterStatus" style="font-size: 0.9rem; color: #4b5563; font-weight: 500;">Filtrar por estado</label>
            <select id="filterStatus" class="status-select" style="padding: 0.5rem; border-radius: 6px; border: 1px solid #d1d5db; background: white;">
                <option value="Todos">Todos</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Confirmado">Confirmado</option>
                <option value="Terminado">Terminado</option>
                <option value="Cancelado">Cancelado</option>
            </select>
        </div>

        <!-- Contenedor de Tarjetas de Pedidos -->
        <div id="ordersContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
            <!-- Se llena dinámicamente con TypeScript -->
        </div>
    </main>
</div>

<script type="module" src="./orders.ts"></script>
</body>
</html>
