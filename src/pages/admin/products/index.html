<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Admin Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
</head>
<body>
<div class="admin-layout">
    <!-- Sidebar Fijo -->
    <aside class="admin-sidebar">
        <div>
            <div class="sidebar-brand">
                🍔 Food Store <span>Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="../home/index.html" class="sidebar-link">📊 Dashboard</a>
                <a href="../categories/index.html" class="sidebar-link">📂 Categorías</a>
                <a href="./index.html" class="sidebar-link active">🍕 Productos</a>
                <a href="../orders/index.html" class="sidebar-link">📦 Pedidos</a>
                <a href="../home/panel.html" class="sidebar-link">🛒 Ver Tienda</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <button id="btnLogout" class="btn-primary" style="width: 100%; background: #dc2626;">Cerrar sesión</button>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="admin-main-content">
        <div class="admin-header-title">
            <h1>Productos</h1>
            <button id="btnOpenModal" class="btn-primary" style="background-color: #ff5722; padding: 0.6rem 1.2rem; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: 600;">+ Nuevo producto</button>
        </div>

        <!-- Tabla de Productos -->
        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>IMAGEN</th>
                    <th>NOMBRE</th>
                    <th>DESCRIPCIÓN</th>
                    <th>PRECIO</th>
                    <th>CATEGORÍA</th>
                    <th>STOCK</th>
                    <th>ESTADO</th>
                    <th style="text-align: right;">ACCIONES</th>
                </tr>
                </thead>
                <tbody id="productsTableBody">
                <!-- Se llena dinámicamente con TypeScript -->
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal para Crear / Editar Producto -->
<div id="productModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div class="admin-card" style="width: 450px; background: white; padding: 2rem; max-height: 90vh; overflow-y: auto;">
        <h3 id="modalTitle" style="margin-top: 0;">Nuevo Producto</h3>
        <form id="productForm">
            <input type="hidden" id="productId">

            <div class="form-group" style="margin-bottom: 0.9rem;">
                <label for="prodName" style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem;">Nombre</label>
                <input type="text" id="prodName" required style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;" placeholder="Ej. Hamburguesa Clásica">
            </div>

            <div class="form-group" style="margin-bottom: 0.9rem;">
                <label for="prodDesc" style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem;">Descripción</label>
                <textarea id="prodDesc" required style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; height: 60px;" placeholder="Ingredientes o detalles"></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 0.9rem;">
                <div class="form-group">
                    <label for="prodPrice" style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem;">Precio ($)</label>
                    <input type="number" id="prodPrice" required style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;" placeholder="4500">
                </div>
                <div class="form-group">
                    <label for="prodStock" style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem;">Stock</label>
                    <input type="number" id="prodStock" required style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;" placeholder="50">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 0.9rem;">
                <label for="prodCategory" style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem;">Categoría</label>
                <select id="prodCategory" required style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; background: white;">
                    <option value="Hamburguesas">Hamburguesas</option>
                    <option value="Pizzas">Pizzas</option>
                    <option value="Empanadas">Empanadas</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Papas Fritas">Papas Fritas</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 1.2rem;">
                <label for="prodImage" style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem;">URL de Imagen</label>
                <input type="text" id="prodImage" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;" placeholder="https://...">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.8rem;">
                <button type="button" id="btnCloseModal" style="background: #e5e7eb; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Cancelar</button>
                <button type="submit" class="btn-primary" style="background: #ff5722; border: none; padding: 0.5rem 1rem; border-radius: 6px; color: white; cursor: pointer;">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="./products.ts"></script>
</body>
</html>
