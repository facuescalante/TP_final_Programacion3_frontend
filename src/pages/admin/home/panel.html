<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Food Store - Catálogo</title>
    <link rel="stylesheet" href="../../../style.css">
</head>
<body>
<header class="main-header">
    <div class="header-left">
        <h1>Food Store 🍕</h1>
        <nav class="header-nav">
            <a href="../home/index.html">Panel Admin</a>

        </nav>
    </div>

    <div class="header-right">
        <a href="" class="cart-link">🛒</a>
        <span class="user-greeting" id="userNameDisplay">Usuario</span>
        <button id="btnLogout" class="btn-logout">Cerrar sesión</button>
    </div>
</header>
<main>
    <!-- Barra de filtros y búsqueda -->
    <section class="filters-section">
        <input type="text" id="searchInput" placeholder="Buscar por nombre..." />

        <!-- Selector de ordenamiento -->
        <select id="sortSelect">
            <option value="">Ordenar por...</option>
            <option value="az">Nombre: A - Z</option>
            <option value="za">Nombre: Z - A</option>
            <option value="asc">Precio: Menor a Mayor</option>
            <option value="desc">Precio: Mayor a Menor</option>
        </select>

        <!-- Contenedor para los botones de categorías -->
        <div id="categoryFilters"></div>
    </section>

    <!-- Grid de productos -->
    <section id="productsContainer" class="products-grid"></section>
</main>
<script type="module" src="/src/pages/client/home/home.ts"></script></body>
</html>
