<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - Admin Food Store</title>
    <link rel="stylesheet" href="../../../style.css">
</head>
<body>
<div class="admin-layout">
    <!-- Sidebar Fijo -->
    <aside class="admin-sidebar">
        <div>
            <div class="sidebar-brand">
                🍔 Food Store <span>Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="../home/index.html" class="sidebar-link">📊 Dashboard</a>
                <a href="./index.html" class="sidebar-link active">📂 Categorías</a>
                <a href="../products/index.html" class="sidebar-link">🍕 Productos</a>
                <a href="../orders/index.html" class="sidebar-link">📦 Pedidos</a>
                <a href="../home/panel.html" class="sidebar-link">🛒 Ver Tienda</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <button id="btnLogout" class="btn-primary" style="width: 100%; background: #dc2626;">Cerrar sesión</button>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="admin-main-content">
        <div class="admin-header-title">
            <h1>Categorías</h1>
            <button id="btnOpenModal" class="btn-primary" style="background-color: #ff5722; padding: 0.6rem 1.2rem; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: 600;">+ Nueva categoría</button>
        </div>

        <!-- Tabla de Categorías -->
        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>IMAGEN</th>
                    <th>NOMBRE</th>
                    <th>DESCRIPCIÓN</th>
                    <th style="text-align: right;">ACCIONES</th>
                </tr>
                </thead>
                <tbody id="categoriesTableBody">
                <!-- Se llena dinámicamente con TypeScript -->
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal para Crear / Editar Categoría -->
<div id="categoryModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
    <div class="admin-card" style="width: 400px; background: white; padding: 2rem;">
        <h3 id="modalTitle" style="margin-top: 0;">Nueva Categoría</h3>
        <form id="categoryForm">
            <input type="hidden" id="categoryId">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="catName" style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem;">Nombre</label>
                <input type="text" id="catName" required style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;" placeholder="Ej. Hamburguesas">
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="catDesc" style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem;">Descripción</label>
                <textarea id="catDesc" required style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; height: 80px;" placeholder="Descripción de la categoría"></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="catImage" style="display: block; margin-bottom: 0.3rem; font-size: 0.9rem;">URL de Imagen (opcional)</label>
                <input type="text" id="catImage" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px;" placeholder="https://...">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.8rem;">
                <button type="button" id="btnCloseModal" style="background: #e5e7eb; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Cancelar</button>
                <button type="submit" class="btn-primary" style="background: #ff5722; border: none; padding: 0.5rem 1rem; border-radius: 6px; color: white; cursor: pointer;">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="./categories.ts"></script>
</body>
</html>
